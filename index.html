<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parc auto</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2B36">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style id="page-style">@page{size:A4 landscape; margin:10mm;}</style>
<style>
  :root{
    --accent:#1F78C8; --accent-dark:#175E9E;
    --infield:#1E2B36; --infield-dark:#151F28;
    --chalk:#F4F5F7; --card:#FFFFFF; --ink:#1D2125; --muted:#677079; --border:#DFE2E6;
    --yellow:#E3A23C; --danger:#B23A32; --ok:#3D7A4E; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--chalk); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-tap-highlight-color:transparent;}
  h1,h2,h3,.display{font-family:'Oswald',system-ui,sans-serif; text-transform:uppercase; letter-spacing:0.02em;}
  #app{display:flex; flex-direction:column; height:100vh;}
  header{background:var(--infield); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:14px 20px; flex-shrink:0; border-bottom:4px solid var(--accent); gap:10px;}
  header .title{display:flex; align-items:baseline; gap:10px; min-width:0;}
  header h1{margin:0; font-size:22px; color:#fff; white-space:nowrap;}
  header .subtitle{font-size:13px; color:#C3CCD4; font-family:'Inter',sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header .date{font-family:'Oswald',sans-serif; font-size:14px; color:#D9DEE3; white-space:nowrap;}
  .body-wrap{flex:1; display:flex; overflow:hidden;}
  nav.sidebar{width:190px; background:var(--infield-dark); flex-shrink:0; display:flex; flex-direction:column; padding:10px 0; overflow-y:auto;}
  nav.sidebar button{display:flex; align-items:center; gap:10px; width:100%; border:none; background:transparent; color:#C9D2DA; font-family:'Inter',sans-serif; font-size:15px; font-weight:600; padding:14px 18px; cursor:pointer; text-align:left; border-left:4px solid transparent;}
  nav.sidebar button svg{flex-shrink:0; width:20px; height:20px;}
  nav.sidebar button.active{background:var(--infield); color:#fff; border-left:4px solid var(--accent);}
  nav.sidebar button:not(.active):hover{background:rgba(255,255,255,0.06);}
  .badge{background:var(--danger); color:#fff; border-radius:10px; font-size:11px; padding:1px 7px; margin-left:auto; font-weight:700;}
  main{flex:1; overflow-y:auto; padding:22px 26px 80px;}
  main h2{font-size:22px; margin:0 0 4px; color:var(--infield);}
  main h3{font-size:16px; margin:0 0 10px; color:var(--infield);}
  .tab-desc{color:var(--muted); font-size:14px; margin:0 0 20px;}
  nav.bottombar{display:none;}
  @media (max-width:760px){
    nav.sidebar{display:none;}
    main{padding:16px 14px 96px;}
    header{padding:10px 14px;} header h1{font-size:18px;}
    header .subtitle, header .date, #btn-save-now span{display:none;}
    nav.bottombar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--infield-dark); border-top:3px solid var(--accent); z-index:20;}
    nav.bottombar button{flex:1 0 66px; display:flex; flex-direction:column; align-items:center; gap:3px; background:transparent; border:none; color:#C9D2DA; font-size:11.5px; font-weight:600; padding:8px 2px 10px; white-space:nowrap; position:relative;}
    nav.bottombar button svg{width:20px; height:20px;}
    nav.bottombar button.active{color:#fff;} nav.bottombar button.active svg{stroke:var(--accent);}
    nav.bottombar .badge{position:absolute; top:4px; right:12px; margin:0;}
  }
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .field label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em;}
  input[type=text], input[type=date], input[type=number], select, textarea{font-family:'Inter',sans-serif; font-size:15px; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; background:#fff; color:var(--ink); min-height:44px; max-width:100%;}
  textarea{min-height:70px; resize:vertical; width:100%;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  input.sm, select.sm{min-height:36px; padding:5px 8px; font-size:14px;}
  button.btn{font-family:'Inter',sans-serif; font-weight:700; font-size:14px; padding:11px 18px; border-radius:8px; border:none; cursor:pointer; min-height:44px; white-space:nowrap;}
  button.btn-primary{background:var(--accent); color:#fff;} button.btn-primary:hover{background:var(--accent-dark);}
  button.btn-secondary{background:#fff; color:var(--infield); border:1.5px solid var(--infield);}
  button.btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border); padding:8px 12px; font-size:13px; min-height:36px;}
  button.btn-ok{background:var(--ok); color:#fff; padding:6px 12px; font-size:13px; min-height:34px;}
  button.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger); padding:8px 12px; font-size:13px; min-height:36px;}
  button.icon-btn{background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--muted); cursor:pointer; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center;}
  button.icon-btn.del{color:var(--danger);}
  .seg{display:inline-flex; border:1.5px solid var(--infield); border-radius:8px; overflow:hidden; flex-wrap:wrap;}
  .seg button{border:none; background:#fff; color:var(--infield); font-weight:700; font-size:14px; padding:0 14px; min-height:40px; cursor:pointer; font-family:'Inter',sans-serif;}
  .seg button.on{background:var(--infield); color:#fff;}
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{text-align:left; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); border-bottom:2px solid var(--border); padding:8px; white-space:nowrap;}
  td{padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  tr.total td{font-weight:700; border-top:2px solid var(--border); background:#F8F9FA;}
  tr.clickable{cursor:pointer;} tr.clickable:hover td{background:#F5F8FB;}
  .empty{text-align:center; padding:40px 20px; color:var(--muted);}
  .empty .display{font-size:17px; color:var(--infield); margin-bottom:6px;}
  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap;}
  .pill-yellow{background:#FBEBD3; color:#8A5A16;} .pill-danger{background:#F6DCDA; color:var(--danger);}
  .pill-ok{background:#DCEBDF; color:var(--ok);} .pill-ghost{background:#ECEDEF; color:var(--muted);}
  .pill-dark{background:#E3E7EB; color:var(--infield);} .pill-blue{background:#D9E6F5; color:#123E70;}
  .stats{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:16px;}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; border-top:4px solid var(--infield);}
  .stat .v{font-family:'Oswald',sans-serif; font-size:28px; color:var(--infield); line-height:1.1;}
  .stat .l{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; font-weight:600;}
  .stat.red{border-top-color:var(--danger);} .stat.red .v{color:var(--danger);}
  .stat.yel{border-top-color:var(--yellow);} .stat.yel .v{color:#8A5A16;}
  .alert{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:12px 16px; border-radius:var(--radius); margin-bottom:12px; font-size:14px;}
  .alert-danger{background:#F6DCDA; color:#7A1F19;} .alert-yellow{background:#FBEBD3; color:#6B4510;} .alert-blue{background:#D9E6F5; color:#123E70;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--infield); color:#fff; padding:10px 20px; border-radius:30px; font-size:14px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.2); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .settings-btn{background:transparent; border:none; color:#C3CCD4; cursor:pointer; padding:6px;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
  .modal{background:#fff; border-radius:12px; padding:22px; width:min(560px,100%); max-height:92vh; overflow-y:auto;}
  .modal h3{margin-top:0; color:var(--infield);}
  .modal .field{margin-bottom:12px;}
  .modal .field input, .modal .field select, .modal .field textarea{width:100%;}
  .modal hr{border:none; border-top:1px solid var(--border); margin:16px 0;}
  .grid2{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
  .grid2 .field input, .grid2 .field select{width:100%;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:1000px){ .two-col{grid-template-columns:1fr;} }
  .sec-head{font-family:'Oswald',sans-serif; text-transform:uppercase; color:var(--infield); font-size:14px; margin:18px 0 8px; letter-spacing:.03em;}
  .muted{color:var(--muted);} .small{font-size:12.5px;}
  .link{background:none; border:none; padding:0; color:var(--infield); font-weight:700; cursor:pointer; text-align:left; font-size:inherit; font-family:inherit; text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:3px;}
  .nap{opacity:.55;}
  /* ---------- RAPOARTE (tipărire / PDF) ---------- */
  .raport{background:#fff; border:1px solid var(--border); border-radius:6px; padding:24px 26px; margin:0 auto 20px; color:#000; font-family:Arial,Helvetica,sans-serif;}
  .raport .r-inst{font-weight:700; font-size:13px;}
  .raport .r-tt{text-align:center; font-weight:700; font-size:18px; margin:12px 0 4px; text-transform:uppercase;}
  .raport .r-sub{text-align:center; font-size:12px; margin-bottom:12px;}
  .raport table{font-size:10.5px; font-family:Arial,Helvetica,sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .raport th, .raport td{border:1px solid #000; padding:4px 5px; color:#000; text-transform:none; letter-spacing:0; font-family:Arial,Helvetica,sans-serif; font-size:10.5px; vertical-align:middle;}
  .raport th{font-weight:700; text-align:center; white-space:normal; background:#E9EDF1;}
  .raport td.c{text-align:center;} .raport td.r{text-align:right; white-space:nowrap;}
  .raport td.rd{background:#F4C7C3;} .raport td.yl{background:#FCE3B5;}
  .raport .r-sem{display:flex; justify-content:space-between; margin-top:26px; font-size:12px; padding:0 30px;}
  .raport .r-leg{font-size:10px; margin-top:6px;}
  @media print{
    body{background:#fff;}
    header, nav, .no-print, .toast{display:none !important;}
    #app{height:auto; display:block;} .body-wrap{overflow:visible; display:block;} main{overflow:visible; padding:0;}
    .raport{border:none; padding:0; margin:0;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-json" accept=".json,application/json" style="display:none">
<input type="file" id="file-xls" accept=".xls,.xlsx" style="display:none">
<input type="file" id="file-ore" accept=".json,application/json" style="display:none">
<script>
/* ============================================================
   PARC AUTO — evidența vehiculelor instituției
   Aplicație de sine stătătoare, offline după prima deschidere.
   Datele stau doar pe dispozitiv (localStorage) + backup JSON.
   ============================================================ */
const STORAGE_KEY='parc-auto-v1', UI_KEY='parc-auto-ui-v1';
const DOCS=[
  {k:'itp',  n:'ITP', s:'ITP', serv:['Obligatorie','ITP']},
  {k:'rca',  n:'Asigurare RCA', s:'RCA', nr:'Serie / nr. poliță', firma:true, serv:['Asigurare','RCA']},
  {k:'rov',  n:'Rovinietă', s:'Rovinietă', serv:['Obligatorie','Rovinietă']},
  {k:'acc',  n:'Asigurare accidente călători', s:'Asig. călători', nr:'Nr. poliță', firma:true, serv:['Asigurare','Asigurare accidente călători']},
  {k:'cert', n:'Certificat transport propriu (copie conformă)', s:'Cert. transport', nr:'Nr. / data', serv:['Obligatorie','Certificat transport propriu']},
  {k:'taho', n:'Verificare tahograf', s:'Tahograf', serv:['Obligatorie','Verificare tahograf']},
];
const STATUSURI=['Activ','În reparație','Inactiv','Casat'];
const TIPURI_VEH=['Autoturism','Microbuz','Autoutilitară','Tractor','Remorcă','Semiremorcă','Trailer baloți','Utilaj'];
const TIPURI_LUCRARE=['Revizie','Revizie anuală','Mentenanță','Reparație mecanică','Reparație electrică','Caroserie','Diagnoză','Vulcanizare','Obligatorie','Asigurare','Altele'];
const LUNI=['','Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
const LUNI_SC=['','Ian','Feb','Mar','Apr','Mai','Iun','Iul','Aug','Sep','Oct','Noi','Dec'];

/* ---------------- utilitare ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDin(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayISO(){ return isoDin(new Date()); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtData(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }
function zileIntre(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); }
function nr(v){ const x=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.')); return isNaN(x)?0:x; }
function fmtNr(x){ return (Math.round(x*100)/100).toLocaleString('ro-RO'); }
function fmtLei(x){ return (Math.round(x*100)/100).toLocaleString('ro-RO',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function plusLuni(iso,n){ const d=new Date(iso+'T12:00:00'); const z=d.getDate(); d.setMonth(d.getMonth()+n); if(d.getDate()!==z) d.setDate(0); return isoDin(d); }
function norm(s){ return String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function nrCheie(s){ return String(s??'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

/* ---------------- stare ---------------- */
function stareImplicita(){ return { settings:{institutie:'Liceul Tehnologic „Alexandru Vlahuță” Șendriceni', prag:30, pragKm:1000, ultimulExport:''}, vehicule:[], service:[], alimentari:[], curse:[] }; }
function vehGol(){ const docs={}; DOCS.forEach(d=>docs[d.k]={ap:['itp','rca'].includes(d.k), expira:'', nr:'', firma:''}); return {id:uid(), tip:'Autoturism', marca:'', nr:'', vin:'', certInm:'', civ:'', combustibil:'', departament:'', status:'Activ', responsabil:'', km:'', kmData:'', unitate:'km', revizieKm:'', obs:'', normaConsum:'', normaSS:'', normaIP:'', stocInitial:'', stocData:'', docs, alte:[]}; }
let state=stareImplicita(), ui={}, currentTab='termene', saveTimer=null, ultimaSalvare=null;
function migreaza(){
  state.settings=Object.assign(stareImplicita().settings, state.settings||{});
  ['vehicule','service','alimentari','curse'].forEach(k=>{ if(!Array.isArray(state[k])) state[k]=[]; });
  state.vehicule.forEach(v=>{ const g=vehGol(); Object.keys(g).forEach(k=>{ if(v[k]===undefined) v[k]=g[k]; }); DOCS.forEach(d=>{ if(!v.docs[d.k]) v.docs[d.k]=g.docs[d.k]; }); if(!Array.isArray(v.alte)) v.alte=[]; });
}
function loadState(){
  try{ const r=localStorage.getItem(STORAGE_KEY); if(r) state=JSON.parse(r); }catch(e){}
  migreaza();
  try{ const u=JSON.parse(localStorage.getItem(UI_KEY)||'{}'); currentTab=u.currentTab||'termene'; ui=u.ui||{}; }catch(e){}
}
function saveNow(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); ultimaSalvare=new Date(); indicator(); return true; }catch(e){ return false; } }
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ if(!saveNow()) toast('Nu am putut salva pe acest dispozitiv.'); },150); }
function saveUI(){ try{ localStorage.setItem(UI_KEY, JSON.stringify({currentTab, ui})); }catch(e){} }
function indicator(){ const el=document.getElementById('save-indicator'); if(el) el.textContent=ultimaSalvare?'Salvat '+ultimaSalvare.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}):''; }
window.addEventListener('beforeunload', saveNow);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveNow(); });
function toast(msg,ms){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), ms||2000); }

/* ---------------- logică ---------------- */
function vehById(id){ return state.vehicule.find(v=>v.id===id)||null; }
function vehOrdonate(){ return [...state.vehicule].sort((a,b)=>(STATUSURI.indexOf(a.status)-STATUSURI.indexOf(b.status)) || (a.nrCrt??999)-(b.nrCrt??999) || a.nr.localeCompare(b.nr,'ro')); }
function vehUrmarit(v){ return v.status!=='Inactiv' && v.status!=='Casat'; }
function stare(expira){
  const p=nr(state.settings.prag)||30;
  if(!expira) return {cls:'pill-danger', txt:'Lipsă dată', z:null, niv:3};
  const z=zileIntre(todayISO(), expira);
  if(z<0) return {cls:'pill-danger', txt:`Expirat de ${-z} ${-z===1?'zi':'zile'}`, z, niv:3};
  if(z===0) return {cls:'pill-danger', txt:'Expiră azi', z, niv:3};
  if(z<=p) return {cls:'pill-yellow', txt:`Expiră în ${z} ${z===1?'zi':'zile'}`, z, niv:2};
  return {cls:'pill-ok', txt:`${z} zile`, z, niv:1};
}
function stareRevizie(v){
  if(!v.revizieKm || v.km==='' || v.km==null) return null;
  const rest=nr(v.revizieKm)-nr(v.km), u=v.unitate==='ore'?'ore':'km';
  if(rest<=0) return {cls:'pill-danger', txt:`Revizie depășită cu ${fmtNr(-rest)} ${u}`, niv:3, rest};
  if(rest<=(nr(state.settings.pragKm)||1000)) return {cls:'pill-yellow', txt:`Revizie peste ${fmtNr(rest)} ${u}`, niv:2, rest};
  return {cls:'pill-ok', txt:`Revizie peste ${fmtNr(rest)} ${u}`, niv:1, rest};
}
function termene(){ // toate termenele vehiculelor urmărite
  const out=[];
  state.vehicule.filter(vehUrmarit).forEach(v=>{
    DOCS.forEach(d=>{ const x=v.docs[d.k]; if(x&&x.ap) out.push({v, k:d.k, nume:d.n, scurt:d.s, expira:x.expira, st:stare(x.expira)}); });
    v.alte.forEach(a=>{ if(a.ap!==false) out.push({v, alt:a.id, nume:a.nume, scurt:a.nume, expira:a.expira, st:stare(a.expira)}); });
    const r=stareRevizie(v); if(r) out.push({v, rev:true, nume:'Revizie tehnică', scurt:'Revizie', expira:'', st:{...r, z:null}});
  });
  return out.sort((a,b)=>b.st.niv-a.st.niv || (a.st.z??-1e9)-(b.st.z??-1e9) || a.v.nr.localeCompare(b.v.nr));
}
function celMaiRau(v){ let m=null; termene().filter(t=>t.v===v).forEach(t=>{ if(!m || t.st.niv>m.st.niv || (t.st.niv===m.st.niv && (t.st.z??-1e9)<(m.st.z??-1e9))) m=t; }); return m; }
function departamente(){ return [...new Set(state.vehicule.map(v=>v.departament).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ro')); }
function aniService(){ const s=new Set(state.service.filter(x=>x.data).map(x=>x.data.slice(0,4))); s.add(todayISO().slice(0,4)); return [...s].sort().reverse(); }
function costVeh(v, an){ return state.service.filter(s=>s.vehId===v.id && (!an || (s.data||'').startsWith(an))).reduce((a,s)=>a+nr(s.valoare),0); }

/* ---------------- consum carburant ---------------- */
function uMas(v){ return v&&v.unitate==='ore'?'ore':'km'; }
function eOra(c){ return c.fel==='ora'; }
function kmCursa(c){ return (c.kmStart!==''&&c.kmStart!=null&&c.kmStop!==''&&c.kmStop!=null) ? Math.max(0, nr(c.kmStop)-nr(c.kmStart)) : nr(c.km); }
function parcursCursa(c){ const v=vehById(c.vehId); if(eOra(c)) return kmCursa(c); return uMas(v)==='ore' ? nr(c.ore) : kmCursa(c); }
function normaOra(v, regim){ return nr(regim==='IP' ? v.normaIP : v.normaSS); }
function consumCursa(c){ const v=vehById(c.vehId); if(!v) return 0;
  if(eOra(c)) return nr(c.nrOre)*normaOra(v, c.regim);
  const n=nr(v.normaConsum); return uMas(v)==='ore' ? nr(c.ore)*n : kmCursa(c)*n/100; }
function etNorma(v){ return uMas(v)==='ore' ? 'l/oră funcț.' : 'l/100 km'; }
function areNorma(v){ return nr(v.normaConsum)>0 || nr(v.normaSS)>0 || nr(v.normaIP)>0; }
function textNorme(v){ const p=[]; if(nr(v.normaSS)) p.push(`SS ${fmtNr(nr(v.normaSS))} l/h`); if(nr(v.normaIP)) p.push(`IP ${fmtNr(nr(v.normaIP))} l/h`); if(nr(v.normaConsum)) p.push(`curse ${fmtNr(nr(v.normaConsum))} ${etNorma(v)}`); return p.join(' · '); }
function inPer(d,de,pana){ return d && d>=de && d<=pana; }
function bilant(v, de, pana){
  const al=state.alimentari.filter(a=>a.vehId===v.id && inPer(a.data,de,pana)), cu=state.curse.filter(c=>c.vehId===v.id && inPer(c.data,de,pana));
  const b={al, cu, litri:0, valoare:0, oreSS:0, oreIP:0, kmOre:0, consumOre:0, parcursCurse:0, consumCurse:0, nCurse:0};
  al.forEach(a=>{ b.litri+=nr(a.litri); b.valoare+=nr(a.valoare); });
  cu.forEach(c=>{ const x=consumCursa(c); if(eOra(c)){ if(c.regim==='IP') b.oreIP+=nr(c.nrOre); else b.oreSS+=nr(c.nrOre); b.kmOre+=kmCursa(c); b.consumOre+=x; } else { b.parcursCurse+=parcursCursa(c); b.consumCurse+=x; b.nCurse++; } });
  b.consum=b.consumOre+b.consumCurse; b.parcurs=b.kmOre+(uMas(v)==='ore'?0:b.parcursCurse);
  return b;
}
function stocLa(v, iso){ // stocul la începutul zilei iso
  const de=v.stocData||'0000-01-01'; if(iso<=de) return nr(v.stocInitial);
  const b=bilant(v, de, plusZileISO(iso,-1)); return nr(v.stocInitial)+b.litri-b.consum;
}
function ultimKm(vehId, data, ora){ // ultimul km la bord cunoscut înainte de (data, ora)
  const k=(c)=>c.data+' '+(c.ora||'99:99');
  const lim=data+' '+(ora||'00:00');
  const l=state.curse.filter(c=>c.vehId===vehId && c.kmStop!=='' && c.kmStop!=null && k(c)<lim).sort((a,b)=>k(b).localeCompare(k(a)));
  if(l.length) return nr(l[0].kmStop);
  const v=vehById(vehId); return (v && v.km!=='' && v.km!=null && (!v.kmData || v.kmData<=data)) ? nr(v.km) : '';
}
function ultimaZi(luna){ const [y,m]=luna.split('-').map(Number); return isoDin(new Date(y, m, 0, 12)); }
function numeLuna(luna){ const [y,m]=luna.split('-'); return LUNI[+m]+' '+y; }

function actualizeazaFormCursa(){
  const v=vehById((document.getElementById('cu-veh')||{}).value); if(!v) return;
  const ora=(ui.cuFel||'cursa')==='ora', funct=!ora && uMas(v)==='ore';
  document.querySelectorAll('.cu-km').forEach(e=>e.style.display=funct?'none':'');
  document.querySelectorAll('.cu-orefunct').forEach(e=>e.style.display=funct?'':'none');
  const ks=document.getElementById('cu-ks'), d=document.getElementById('cu-data').value, o=(document.getElementById('cu-ora')||{}).value;
  if(ks && !funct){ const u=ultimKm(v.id, d||todayISO(), o||'23:59'); ks.value = u!=='' ? u : (v.km!==''&&v.km!=null ? v.km : ''); }
  calcCursa();
}
function citesteCursaForm(){
  const v=vehById(document.getElementById('cu-veh').value), g=id=>{ const e=document.getElementById(id); return e?e.value:''; };
  const ora=(ui.cuFel||'cursa')==='ora';
  const c={vehId:v&&v.id, data:g('cu-data'), fel:ora?'ora':'cursa', kmStart:g('cu-ks'), kmStop:g('cu-kf'), sofer:g('cu-sofer').trim(), scop:g('cu-scop').trim(), foaie:g('cu-foaie').trim()};
  if(ora){ c.regim=g('cu-regim')||'SS'; c.ora=g('cu-ora'); c.nrOre=nr(g('cu-nrore')); }
  else if(v && uMas(v)==='ore'){ c.ore=nr(g('cu-orefunct')); c.kmStart=''; c.kmStop=''; }
  return {v, c};
}
function calcCursa(){
  const el=document.getElementById('cu-calc'); if(!el) return; const {v,c}=citesteCursaForm(); if(!v) return;
  if(eOra(c)){ const n=normaOra(v,c.regim); el.textContent = n ? `${fmtNr(c.nrOre)} h × ${fmtNr(n)} l/h (${c.regim}) = ${fmtNr(consumCursa(c))} l` : `Mașina nu are normă pe oră ${c.regim}.`; return; }
  const p=parcursCursa(c);
  el.textContent = !nr(v.normaConsum) ? 'Mașina nu are normă pentru curse.' : p>0 ? `${fmtNr(p)} ${uMas(v)} × ${fmtNr(nr(v.normaConsum))} ${etNorma(v)} = ${fmtNr(consumCursa(c))} l` : '';
}
/* ---- import ore din aplicația Școala de șoferi ---- */
function importOre(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let p; try{ p=JSON.parse(rd.result); }catch(e){ return toast('Fișierul nu poate fi citit.'); }
    if(!p || p.tip!=='export-ore-conducere' || !Array.isArray(p.ore)) return toast('Nu este un fișier cu ore exportat din aplicația Școala de șoferi.', 4000);
    const instr=String(p.instructor||'').trim()||'Instructor', luna=p.luna||'';
    const pe={}, necunoscute={}; let fara=0;
    p.ore.forEach(o=>{ if(!o.masina){ fara++; return; } const v=state.vehicule.find(x=>nrCheie(x.nr)===nrCheie(o.masina)); if(!v){ necunoscute[o.masina]=(necunoscute[o.masina]||0)+1; return; } (pe[v.id]=pe[v.id]||[]).push(o); });
    const vechi=state.curse.filter(c=>c.sursa==='scoala-soferi' && c.sofer===instr && (c.data||'').slice(0,7)===luna).length;
    const randuri=Object.entries(pe).map(([id,l])=>{ const v=vehById(id), ss=l.filter(o=>o.regim!=='IP').reduce((a,o)=>a+nr(o.nrOre),0), ip=l.filter(o=>o.regim==='IP').reduce((a,o)=>a+nr(o.nrOre),0);
      return `<tr><td><b>${esc(v.nr)}</b></td><td class="num">${fmtNr(ss)}</td><td class="num">${fmtNr(ip)}</td><td class="num">${fmtNr(l.reduce((a,o)=>a+nr(o.km),0))}</td><td>${normaOra(v,'SS')||normaOra(v,'IP')?'':'<span class="pill pill-danger">fără normă/oră</span>'}</td></tr>`; }).join('');
    const b=openModal(`<h3>Ore de conducere — ${esc(instr)}</h3><p class="muted small" style="margin-top:-6px;">${luna?numeLuna(luna):''} · ${p.ore.length} ore în fișier</p>
      ${randuri?`<div class="table-wrap"><table><thead><tr><th>Mașina</th><th class="num">Ore SS</th><th class="num">Ore IP</th><th class="num">Km</th><th></th></tr></thead><tbody>${randuri}</tbody></table></div>`:'<p>Nicio oră nu se potrivește cu mașinile din parc.</p>'}
      ${Object.keys(necunoscute).length?`<p class="small" style="color:var(--danger);"><b>Mașini care nu sunt în parc:</b> ${Object.entries(necunoscute).map(([k,n])=>`${esc(k)} (${n} ore)`).join(', ')} — nu se încarcă. Verifică numărul de înmatriculare.</p>`:''}
      ${fara?`<p class="small" style="color:var(--danger);">${fara} ore nu au mașina aleasă în aplicația instructorului — nu se încarcă.</p>`:''}
      ${vechi?`<p class="small"><b>Atenție:</b> există deja ${vechi} ore de la ${esc(instr)} în ${luna?numeLuna(luna).toLowerCase():'această lună'}. Vor fi înlocuite cu cele din fișier.</p>`:''}
      <p class="small muted">Km la plecare/sosire se calculează pe fiecare mașină, în ordinea orelor, pornind de la ultimul km cunoscut în aplicație.</p>
      <div class="row" style="justify-content:flex-end;"><button class="btn btn-ghost" id="io-x">Renunță</button><button class="btn btn-primary" id="io-ok" ${randuri?'':'disabled'}>Încarcă orele</button></div>`);
    b.querySelector('#io-x').onclick=closeModal;
    b.querySelector('#io-ok').onclick=()=>{
      state.curse=state.curse.filter(c=>!(c.sursa==='scoala-soferi' && c.sofer===instr && (c.data||'').slice(0,7)===luna));
      let n=0;
      Object.entries(pe).forEach(([id,l])=>{ const v=vehById(id);
        l.sort((a,b)=>(a.data+(a.ora||'')).localeCompare(b.data+(b.ora||''))).forEach(o=>{
          const st=ultimKm(id, o.data, o.ora||'00:00'), km=nr(o.km);
          const c={id:uid(), vehId:id, data:o.data, ora:o.ora||'', fel:'ora', regim:o.regim==='IP'?'IP':'SS', nrOre:nr(o.nrOre), km, kmStart:st===''?'':st, kmStop:st===''?'':st+km, sofer:instr, scop:'', foaie:'', sursa:'scoala-soferi', sursaId:o.id};
          state.curse.push(c); n++;
          if(c.kmStop!=='' && (v.km===''||v.km==null||nr(c.kmStop)>=nr(v.km))){ v.km=c.kmStop; v.kmData=c.data; }
        }); });
      ui.consLuna=luna||ui.consLuna; save(); closeModal(); currentTab='consum'; render(); toast(`${n} ore încărcate ✓`, 2500);
    };
  };
  rd.readAsText(file);
}

    <div class="r-leg">Consum ore de conducere = ore × norma SS sau IP a mașinii (l/oră). Consum curse = km × norma / 100 (la utilaje: ore funcționare × normă). Stoc final = stoc inițial + alimentat − consum total.</div>

/* ---------------- PDF / tipărire ---------------- */
async function salveazaPDF(){
  if(typeof html2pdf==='undefined') return toast('Pentru PDF e nevoie de internet o singură dată (se încarcă generatorul). Încearcă din nou cu internet.', 4000);
  const r=document.querySelector('#main .raport'); if(!r) return toast('Nimic de salvat.');
  const land=orientareRaport()==='landscape', w=land?277:190;
  const box=document.createElement('div'); box.style.cssText=`width:${w}mm; background:#fff;`;
  const c=r.cloneNode(true); c.style.cssText=`border:none; padding:0; margin:0; max-width:none; width:${w}mm;`; box.appendChild(c);
  const v=ui.raport||'situatie';
  const nume=({situatie:'Situatia-parcului-auto-'+todayISO(), termene:'Termene-parc-auto-'+todayISO(), cheltuieli:'Cheltuieli-parc-auto-'+(ui.raportAn||todayISO().slice(0,4)), consum:'Consum-carburant-'+(ui.consLuna||todayISO().slice(0,7)), fisa:'Fisa-vehicul-'+nrCheie((vehById(ui.raportVeh)||vehOrdonate()[0]||{}).nr)}[v])+'.pdf';
  toast('Se creează PDF-ul…',1500);
  try{
    const blob=await html2pdf().set({margin:10, filename:nume, image:{type:'jpeg',quality:0.96}, html2canvas:{scale:2, backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm', format:'a4', orientation:land?'landscape':'portrait'}, pagebreak:{mode:['css','legacy'], avoid:'tr'}}).from(box).outputPdf('blob');
    await partajeazaSauDescarca(new Blob([blob],{type:'application/pdf'}), nume, nume);
  }catch(e){ console.error(e); toast('Nu am putut crea PDF-ul.'); }
}
function tipareste(){ document.getElementById('page-style').textContent=`@page{size:A4 ${orientareRaport()}; margin:10mm;}`; window.print(); }
async function partajeazaSauDescarca(blob, filename, titlu){
  try{ const file=new File([blob], filename, {type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)){ await navigator.share({files:[file], title:titlu}); return 'share'; }
  }catch(e){ if(e && e.name==='AbortError') return 'cancel'; }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  return 'download';
}

/* ---------------- IMPORT EXCEL ---------------- */
function valData(x){
  if(x instanceof Date && !isNaN(x)) return isoDin(new Date(x.getTime()+12*3600e3));
  if(typeof x==='number' && x>20000 && x<80000){ const d=new Date(Math.round((x-25569)*86400e3)+12*3600e3); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`; }
  const m=String(x??'').match(/(\d{1,2})[./-](\d{1,2})[./-](\d{4})/); if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  return '';
}
function txt(x){ if(x==null) return ''; if(x instanceof Date) return fmtData(valData(x)); const s=String(x).trim(); return (s==='-'||s==='—')?'':s; }
function eNC(x){ return /nu este cazul|^n\.?\s?c\.?$/.test(norm(x)); }
function gasesteTabel(wb, cuvinte){
  for(const n of wb.SheetNames){ const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1, raw:true, defval:''});
    for(let i=0;i<Math.min(rows.length,30);i++){ const h=rows[i].map(norm); if(cuvinte.every(c=>h.some(x=>x.includes(c)))) return {rows, i, h}; } }
  return null;
}
function col(h, cuv, occ){ let c=0; for(let i=0;i<h.length;i++){ if(h[i].includes(cuv)){ if(c===(occ||0)) return i; c++; } } return -1; }
function importXls(file){
  if(typeof XLSX==='undefined') return toast('Pentru citirea Excel e nevoie de internet o singură dată. Încearcă din nou cu internet.', 4000);
  const rd=new FileReader();
  rd.onload=()=>{
    let wb; try{ wb=XLSX.read(new Uint8Array(rd.result),{type:'array', cellDates:true}); }catch(e){ return toast('Nu am putut citi fișierul Excel.'); }
    const P=gasesteTabel(wb,['numar inmatriculare','tip vehicul']);
    if(!P) return toast('Nu am găsit tabelul cu vehiculele (coloanele „Tip vehicul” și „Număr înmatriculare”).', 4500);
    const h=P.h, C={tip:col(h,'tip vehicul'), marca:col(h,'marca'), nr:col(h,'numar inmatriculare'), vin:col(h,'serie sasiu'), cert:col(h,'certificat inmatriculare'), civ:col(h,'carte identitate'),
      comb:col(h,'combustibil'), dep:col(h,'departament'), status:col(h,'status'), itp:col(h,'expirare itp'), rcaNr:col(h,'polita rca'), rcaF:col(h,'societate',0), rcaE:col(h,'expirare asigurare rca'),
      rov:col(h,'rovin'), rev:col(h,'urmatoarea revizie'), km:col(h,'kilometraj'), resp:col(h,'responsabil'), accNr:col(h,'accidente calatori'), accF:col(h,'societate',1), accE:col(h,'expirare asigurare accidente'),
      certNr:col(h,'certificat transport'), certE:col(h,'expirare certificat'), taho:col(h,'tahograf'), alte:col(h,'alte detalii'), nrc:col(h,'crt')};
    const g=(r,k)=>C[k]>=0?r[C[k]]:'';
    const veh=[]; for(let i=P.i+1;i<P.rows.length;i++){ const r=P.rows[i]; const n=txt(g(r,'nr')); if(!n || !(txt(g(r,'tip'))||txt(g(r,'marca'))||txt(g(r,'vin')))) continue; veh.push(r); }
    let sv=null; const S=gasesteTabel(wb,['numar inmatriculare','tip lucrare']);
    if(S){ const hh=S.h; sv={rows:S.rows, i:S.i, c:{nr:col(hh,'numar inmatriculare'), data:col(hh,'data'), tip:col(hh,'tip lucrare'), desc:col(hh,'descriere'), val:col(hh,'valoare'), doc:col(hh,'factura')}}; if(sv.c.doc<0) sv.c.doc=col(hh,'document'); }
    const servOk=r=>txt(r[sv.c.nr]) && (txt(r[sv.c.desc])||txt(r[sv.c.tip])) && (valData(r[sv.c.data]) || nr(r[sv.c.val])>0); // rândurile fără dată și fără valoare sunt exemple / necompletate
    const nServ=sv?sv.rows.slice(sv.i+1).filter(servOk).length:0, nSar=sv?sv.rows.slice(sv.i+1).filter(r=>txt(r[sv.c.nr])&&(txt(r[sv.c.desc])||txt(r[sv.c.tip]))&&!servOk(r)).length:0;
    confirma(`Am găsit <b>${veh.length} vehicule</b>${sv?` și <b>${nServ} lucrări</b> în istoricul de service`:''}. Le încarc?`, ()=>{
      let noi=0, act=0, sn=0, creat=[];
      veh.forEach((r,ix)=>{
        const n=txt(g(r,'nr')).toUpperCase().replace(/\s+/g,' ');
        let v=state.vehicule.find(x=>nrCheie(x.nr)===nrCheie(n)); if(!v){ v=vehGol(); state.vehicule.push(v); noi++; } else act++;
        v.nr=n; v.nrCrt=nr(g(r,'nrc'))||ix+1; v.tip=txt(g(r,'tip')); v.marca=txt(g(r,'marca')); v.vin=txt(g(r,'vin')); v.certInm=txt(g(r,'cert')); v.civ=txt(g(r,'civ'));
        v.combustibil=txt(g(r,'comb')); v.departament=txt(g(r,'dep')); v.responsabil=txt(g(r,'resp')); const stt=txt(g(r,'status')); if(stt) v.status=STATUSURI.find(s=>norm(s)===norm(stt))||stt;
        const doc=(k,eCel,nrCel,fCel)=>{ const x=v.docs[k], e=eCel!=null?g(r,eCel):'', nn=nrCel?g(r,nrCel):'', ff=fCel?g(r,fCel):'';
          if(eNC(e)||eNC(nn)){ x.ap=false; x.expira=''; x.nr=''; x.firma=''; return; }
          x.ap=true; x.expira=valData(e); x.nr=txt(nn); x.firma=txt(ff); };
        doc('itp','itp'); doc('rca','rcaE','rcaNr','rcaF'); doc('rov','rov'); doc('acc','accE','accNr','accF');
        if(C.certNr>=0){ const cn=g(r,'certNr'), ce=g(r,'certE'); if(eNC(cn)&&(eNC(ce)||!txt(ce))){ v.docs.cert.ap=false; } else { v.docs.cert.ap=true; v.docs.cert.nr=txt(cn); v.docs.cert.expira=valData(ce); } }
        if(C.taho>=0){ const t=g(r,'taho'); if(eNC(t)||!txt(t)) v.docs.taho.ap=false; else { v.docs.taho.ap=true; v.docs.taho.expira=valData(t); } }
        const km=g(r,'km'); if(typeof km==='number') v.km=km; else { const m=String(km).match(/^\s*([\d.\s]+)/); if(m && nr(m[1].replace(/[.\s]/g,''))) { v.km=nr(m[1].replace(/[.\s]/g,'')); v.kmData=valData(km); } }
        const rv=g(r,'rev'); if(typeof rv==='number') v.revizieKm=rv; else if(nr(rv)) v.revizieKm=nr(rv);
        const al=txt(g(r,'alte')); if(al && !v.obs.includes(al)) v.obs=(v.obs?v.obs+'\n':'')+al.replace(/\s{2,}/g,' ');
      });
      if(sv){ sv.rows.slice(sv.i+1).forEach(r=>{
        if(!servOk(r)) return; const n=txt(r[sv.c.nr]), desc=txt(r[sv.c.desc]), tip=txt(r[sv.c.tip]);
        let v=state.vehicule.find(x=>nrCheie(x.nr)===nrCheie(n));
        if(!v){ v=vehGol(); v.nr=n.toUpperCase(); v.tip=''; v.obs='Adăugat din istoricul de service — completează datele.'; v.status='Activ'; state.vehicule.push(v); creat.push(v.nr); }
        const s={vehId:v.id, data:valData(r[sv.c.data]), tip, descriere:desc, valoare:r[sv.c.val]===''?'':nr(r[sv.c.val]), document:txt(r[sv.c.doc])};
        if(!state.service.some(x=>x.vehId===s.vehId && x.data===s.data && norm(x.descriere)===norm(s.descriere) && nr(x.valoare)===nr(s.valoare))){ state.service.push({id:uid(), ...s}); sn++; }
      }); }
      saveNow(); currentTab='termene'; render();
      const b=openModal(`<h3>Import terminat</h3><p>${noi} vehicule noi, ${act} actualizate${sv?`, ${sn} lucrări de service adăugate`:''}.</p>${nSar?`<p class="small">${nSar} rânduri din istoricul de service n-au nici dată, nici valoare, așa că nu le-am încărcat.</p>`:''}${creat.length?`<p class="small"><b>Atenție:</b> ${creat.map(esc).join(', ')} apare în istoricul de service, dar nu și în lista parcului auto. L-am adăugat ca vehicul — completează-i datele sau șterge-l.</p>`:''}<p class="small muted">Verifică în tabul Termene actele expirate sau fără dată.</p><div class="row" style="justify-content:flex-end;"><button class="btn btn-primary" id="ok-imp">Am înțeles</button></div>`);
      b.querySelector('#ok-imp').onclick=closeModal;
    }, 'Da, încarcă');
  };
  rd.readAsArrayBuffer(file);
}

/* ================= EVENIMENTE ================= */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-tab]'); if(t){ goTab(t.dataset.tab); return; }
  if(e.target.closest('#btn-settings')) return modalSetari();
  if(e.target.closest('#btn-save-now')){ saveNow()?toast('Salvat ✓'):toast('Nu am putut salva.'); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const id=a.dataset.id, v=id?vehById(id):null;
  switch(a.dataset.act){
    case 'term-f': ui.termFiltru=a.dataset.v; render(); break;
    case 'veh-open': ui.vehDetaliu=id; currentTab='vehicule'; render(); document.getElementById('main').scrollTop=0; break;
    case 'veh-back': ui.vehDetaliu=null; render(); break;
    case 'veh-nou': modalVehNou(); break;
    case 'veh-del': confirma(`Ștergi vehiculul <b>${esc(v.nr)}</b> cu tot istoricul lui (service, alimentări, curse)?`, ()=>{ state.vehicule=state.vehicule.filter(x=>x.id!==id); state.service=state.service.filter(s=>s.vehId!==id); state.alimentari=state.alimentari.filter(x=>x.vehId!==id); state.curse=state.curse.filter(x=>x.vehId!==id); ui.vehDetaliu=null; save(); render(); }); break;
    case 'renew': modalRenew(v, a.dataset.k, a.dataset.alt); break;
    case 'km-upd': modalKm(v); break;
    case 'alt-add': { const n=document.getElementById('alt-nume').value.trim(); if(!n) return toast('Scrie numele actului.'); v.alte.push({id:uid(), nume:n, expira:document.getElementById('alt-exp').value, ap:true}); save(); render(); break; }
    case 'alt-del': confirma('Ștergi actul?', ()=>{ v.alte=v.alte.filter(x=>x.id!==a.dataset.a); save(); render(); }); break;
    case 'serv-add': { const s=citesteService('s'); if(!s.vehId) return toast('Alege vehiculul.'); if(!s.descriere&&!s.tip) return toast('Scrie tipul sau descrierea lucrării.'); ui.servUltimVeh=s.vehId; state.service.push({id:uid(), ...s}); save(); render(); toast('Lucrare adăugată ✓'); break; }
    case 'serv-nou': modalServNou(id); break;
    case 'serv-edit': modalServEdit(state.service.find(s=>s.id===a.dataset.s)); break;
    case 'serv-del': confirma('Ștergi lucrarea?', ()=>{ state.service=state.service.filter(s=>s.id!==a.dataset.s); save(); render(); }); break;
    case 'raport-tip': ui.raport=a.dataset.v; render(); break;
    case 'raport-consum': ui.raport='consum'; goTab('rapoarte'); break;
    case 'al-add': { const vv=vehById(document.getElementById('al-veh').value), l=nr(document.getElementById('al-l').value), d=document.getElementById('al-data').value;
      if(!vv||!d) return toast('Alege vehiculul și data.'); if(!(l>0)) return toast('Scrie câți litri.');
      state.alimentari.push({id:uid(), vehId:vv.id, data:d, litri:l, valoare:document.getElementById('al-val').value, document:document.getElementById('al-doc').value.trim()});
      ui.consUltimVeh=vv.id; save(); render(); toast(`Alimentare ${vv.nr}: ${fmtNr(l)} l ✓`); break; }
    case 'cu-fel': ui.cuFel=a.dataset.v; render(); break;
    case 'import-ore': document.getElementById('file-ore').click(); break;
    case 'cu-add': { const {v:vv, c}=citesteCursaForm(); if(!vv||!c.data) return toast('Alege vehiculul și data.');
      if(eOra(c)){ if(!(c.nrOre>0)) return toast('Scrie câte ore.'); if(!c.sofer) return toast('Scrie instructorul.'); }
      else if(uMas(vv)==='ore'){ if(!(nr(c.ore)>0)) return toast('Scrie orele de funcționare.'); }
      if(!(eOra(c)===false && uMas(vv)==='ore')){
        if(!eOra(c) && (c.kmStop==='' || c.kmStart==='')) return toast('Scrie km la plecare și la sosire.');
        if(c.kmStop!=='' && c.kmStart!=='' && nr(c.kmStop)<nr(c.kmStart)) return toast('Km la sosire trebuie să fie mai mari decât la plecare.');
        if(c.kmStop!=='' && (vv.km==='' || nr(c.kmStop)>=nr(vv.km))){ vv.km=nr(c.kmStop); vv.kmData=c.data; } }
      if(eOra(c)) ui.ultimInstr=c.sofer;
      state.curse.push({id:uid(), ...c}); ui.consUltimVeh=vv.id; save(); render();
      toast(`${vv.nr}: ${felText(c)}, ${fmtNr(consumCursa(c))} l ✓`, 2600); break; }
    case 'al-del': confirma('Ștergi alimentarea?', ()=>{ state.alimentari=state.alimentari.filter(x=>x.id!==a.dataset.x); save(); render(); }); break;
    case 'cu-del': confirma('Ștergi cursa?', ()=>{ state.curse=state.curse.filter(x=>x.id!==a.dataset.x); save(); render(); }); break;
    case 'raport-veh': ui.raport='fisa'; ui.raportVeh=id; goTab('rapoarte'); break;
    case 'pdf': salveazaPDF(); break;
    case 'print': tipareste(); break;
    case 'export-json': closeModal(); exportJson(); break;
    case 'import-json': closeModal(); document.getElementById('file-json').click(); break;
    case 'import-xls': closeModal(); document.getElementById('file-xls').click(); break;
    case 'sterge-tot': confirma('Ștergi <b>toate</b> vehiculele și lucrările de pe acest dispozitiv? Fă înainte un backup.', ()=>{ state=stareImplicita(); saveNow(); render(); toast('Date șterse.'); }); break;
  }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='file-json'){ if(t.files[0]) importJson(t.files[0]); t.value=''; return; }
  if(t.id==='file-xls'){ if(t.files[0]) importXls(t.files[0]); t.value=''; return; }
  if(t.id==='cu-veh'||t.id==='cu-data'||t.id==='cu-ora'){ actualizeazaFormCursa(); return; }
  if(t.id==='cu-regim'){ calcCursa(); return; }
  if(t.id==='file-ore'){ if(t.files[0]) importOre(t.files[0]); t.value=''; return; }
  if(t.dataset.ui){ ui[t.dataset.ui]=t.value; render(); return; }
  if(t.dataset.veh){ const v=vehById(t.dataset.id); let val=t.value; if(t.dataset.veh==='nr') val=val.trim().toUpperCase(); v[t.dataset.veh]=val; save(); if(t.tagName!=='TEXTAREA') render(); toast('Salvat ✓',900); return; }
  if(t.dataset.doc){ const v=vehById(t.dataset.id), x=v.docs[t.dataset.k]; x[t.dataset.doc]=t.dataset.doc==='ap'?t.value==='1':t.value; save(); render(); toast('Salvat ✓',900); return; }
  if(t.dataset.alt){ const v=vehById(t.dataset.id), x=v.alte.find(q=>q.id===t.dataset.a); x[t.dataset.alt]=t.value; save(); render(); toast('Salvat ✓',900); return; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('input', e=>{ if(['cu-ks','cu-kf','cu-orefunct','cu-nrore'].includes(e.target.id)) calcCursa(); });
window.addEventListener('afterprint', ()=>{ document.getElementById('page-style').textContent='@page{size:A4 landscape; margin:10mm;}'; });

/* ================= PORNIRE ================= */
loadState(); render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
